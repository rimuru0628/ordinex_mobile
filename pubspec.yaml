name: beealert_mobile
description: BEE-Alert — Municipal Ordinance Reporting App for Bacnotan, La Union.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.5

  # Media & Location
  image_picker: ^1.2.3
  geolocator: ^10.1.1
  geocoding: ^3.0.0
  video_player: ^2.9.2
  chewie: ^1.8.5

  # Utilities
  intl: ^0.18.1
  url_launcher: ^6.3.2
  http: ^1.2.2
  rxdart: ^0.28.0

  # UI
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  fake_cloud_firestore: ^3.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
